name: Dune Showtime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes or so
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Prevents a manual run and a scheduled run from overlapping and both trying
# to push a state.txt update at the same time — runs queue up instead.
concurrency:
  group: dune-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run availability check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TARGET_DATE: "December 17, 2026"
        run: python scripts/check_availability.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "showtime-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet state.txt; then
            echo "No state change."
            exit 0
          fi
          git add state.txt
          git commit -m "Update availability state"
          # Safety net: pull any newer remote commits before pushing, in case
          # something still slips past the concurrency lock.
          git pull --rebase origin main
          git push
